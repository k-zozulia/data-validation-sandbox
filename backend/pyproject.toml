[project]
name = "dvs-backend"
version = "2.0.0"
description = "Data Validation Sandbox — API and worker"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B904", "SIM108", "UP031"]   # Depends()/File() defaults; clean 4xx re-raises
