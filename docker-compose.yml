services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: dvs-data-419772658013
      AWS_REGION: eu-central-1
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: dvs-data-419772658013
      AWS_REGION: eu-central-1
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery worker --loglevel=info