name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dvs
          POSTGRES_PASSWORD: dvs
          POSTGRES_DB: dvs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dvs" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations apply cleanly
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://dvs:dvs@localhost:5432/dvs_test
        run: alembic upgrade head && alembic downgrade base
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://dvs:dvs@localhost:5432/dvs_test' || '' }}
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check src
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose -f docker-compose.prod.yml build
